# ==============================================================================
# RENDER BLUEPRINT (render.yaml) - AUTOMATED DEPLOYMENT FOR RENDER.COM
# ==============================================================================
# This configuration file automates the deployment process on Render.
# It defines the service as a Python web service using Gunicorn as the WSGI server
# to keep the Flask API, Telegram Bot, and background scheduler running 24/7.
#
# Deployment Instructions:
# 1. Log in to https://dashboard.render.com
# 2. Click "New +" -> "Blueprint"
# 3. Connect your repository
# 4. Render will automatically apply this configuration!
# ==============================================================================

services:
  - type: web
    name: curso-python-bot
    runtime: python
    region: oregon # or ohio, frankfurt, virginia, singapore
    plan: free
    rootDir: python_backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Python runtime configuration
      - key: PYTHON_VERSION
        value: 3.11.8

      # Flask Server Port (Render sets this dynamically, defaults to 10000)
      - key: PORT
        value: 10000

      # Secret key for session signing and Flask security
      - key: SECRET_KEY
        generateValue: true

      # Telegram Bot Configuration
      # Note: Can be provided here or configured directly via the system gear icon (⚙️)
      - key: TELEGRAM_BOT_TOKEN
        value: 8894323284:AAHyfUMZwE1m5eM1JXmdhkv_oZH1E9yEixY

      # Telegram Channel identifier for broadcast and public link redirection
      - key: TELEGRAM_CHANNEL_ID
        value: "@seucanalpublico"

      # External Profile and Support links
      - key: INSTAGRAM_URL
        value: "https://instagram.com/seuperfil"

      - key: SUPPORT_USERNAME
        value: "suporte_hub"

      # Database Configuration (SQLite default; can also accept PostgreSQL from Render)
      - key: DATABASE_URL
        value: "sqlite:///content_os.db"

      # Optional Render Persistent Disk (available on Starter plan or above):
      # disk:
      #   name: content-os-storage
      #   mountPath: /data
      #   sizeGB: 1
